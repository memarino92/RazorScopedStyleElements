name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.102

      - name: Restore
        run: dotnet restore RazorScopedStyleElements.slnx

      - name: Verify formatting
        run: dotnet format RazorScopedStyleElements.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build RazorScopedStyleElements.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RazorScopedStyleElements.slnx --configuration Release --no-build

  pack:
    name: Validate package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.102

      - name: Pack
        run: dotnet pack src/RazorScopedStyleElements.Package/RazorScopedStyleElements.Package.csproj --configuration Release --output artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: RazorScopedStyleElements-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
