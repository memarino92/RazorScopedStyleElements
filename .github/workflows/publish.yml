name: Publish NuGet

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_XMLDOC_MODE: skip

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: nuget.org

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.102

      - name: Set package version
        shell: bash
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore RazorScopedStyleElements.slnx

      - name: Verify formatting
        run: dotnet format RazorScopedStyleElements.slnx --no-restore --verify-no-changes

      - name: Build
        run: dotnet build RazorScopedStyleElements.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RazorScopedStyleElements.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/RazorScopedStyleElements.Package/RazorScopedStyleElements.Package.csproj --configuration Release --no-build --output artifacts/packages -p:PackageVersion=${{ env.PACKAGE_VERSION }}

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package
        run: dotnet nuget push artifacts/packages/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
